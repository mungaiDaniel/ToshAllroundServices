# Free Supabase projects pause after a period without activity. This job asks the database for the public
# website content every 2 days, which counts as activity, so the project (and the admin login) never pauses.
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret:
#   SUPABASE_URL       e.g. https://hoxhqpkiaiddxdoysntk.supabase.co
#   SUPABASE_ANON_KEY  the public "publishable" key (same value as VITE_SUPABASE_ANON_KEY)
# Run it once by hand: repo -> Actions -> "Keep Supabase awake" -> Run workflow.
name: Keep Supabase awake

on:
  schedule:
    - cron: '23 5 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call get_public_content
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY secret" && exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${SUPABASE_URL%/}/rest/v1/rpc/get_public_content" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "Supabase answered HTTP $code"
          test "$code" = "200"
